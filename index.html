<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card - Al-Ahram Group</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --border-color: #e2d7c3;
            --text-primary: #2a241e;
            --text-secondary: #6e6557;
            --gold-primary: #c29235;
            --gold-dark: #8a611c;
            --gold-light: #f4ece1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(194, 146, 53, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(138, 97, 28, 0.1) 0px, transparent 50%);
        }

        .vcard-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(138, 97, 28, 0.12);
        }

        /* Company Logo Header at Top */
        .company-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .company-logo {
            max-width: 190px;
            height: auto;
            margin: 0 auto 4px auto;
            display: block;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold-primary);
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(194, 146, 53, 0.2);
        }

        .name {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .title {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Primary Call to Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(138, 97, 28, 0.25);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--gold-dark);
            border: 2px solid var(--gold-primary);
        }

        /* Direct Contact Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--gold-light);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            text-decoration: none;
        }

        .action-icon {
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            color: var(--gold-dark);
        }

        .action-text {
            display: flex;
            flex-direction: column;
        }

        .action-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .action-val {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Footer */
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }
    </style>
</head>
<body>

    <div class="vcard-container">
        
        <!-- Company Logo Header -->
        <div class="company-header">
            <!-- Replace with direct link to your logo image -->
            <img src="https://example.com/logo.jpg" alt="Al-Ahram Group Logo" class="company-logo">
        </div>

        <!-- Profile Section -->
        <div class="profile">
            <!-- PHOTO AS AN EXTERNAL WEB LINK -->
            <img src="https://example.com/your-photo.jpg" alt="Mina Maged" class="avatar">
            <h1 class="name">Mina Maged</h1>
            <p class="title">Sales Executive | Packaging Solutions</p>
        </div>

        <!-- Primary Actions -->
        <div class="btn-group">
            <!-- Company Website Link -->
            <a href="https://your-company-website.com" target="_blank" class="btn btn-secondary">
                <i class="fa-solid fa-globe"></i> Visit Official Website
            </a>

            <!-- CATALOG AS AN EXTERNAL WEB LINK (Google Drive, Dropbox, Website URL) -->
            <a href="https://your-domain.com/path-to-your-catalog.pdf" target="_blank" class="btn btn-secondary">
                <i class="fa-solid fa-file-pdf"></i> View Product Catalog
            </a>

            <!-- Save Contact Button -->
            <button class="btn btn-primary" onclick="downloadVCard()">
                <i class="fa-solid fa-user-plus"></i> Save Contact
            </button>
        </div>

        <!-- Direct Contact Grid -->
        <div class="action-grid">
            <a href="https://wa.me/201012345678?text=Hi,%20I'd%20like%20to%20inquire%20about%20Al-Ahram%20packaging%20products." class="action-card" target="_blank">
                <i class="fa-brands fa-whatsapp action-icon"></i>
                <div class="action-text">
                    <span class="action-label">WhatsApp</span>
                    <span class="action-val">Chat Now</span>
                </div>
            </a>

            <a href="tel:+201012345678" class="action-card">
                <i class="fa-solid fa-phone action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Call</span>
                    <span class="action-val">Direct Line</span>
                </div>
            </a>

            <a href="mailto:sales@alahramplastic.com" class="action-card">
                <i class="fa-solid fa-envelope action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Email</span>
                    <span class="action-val">Send Mail</span>
                </div>
            </a>

            <a href="https://www.linkedin.com/in/your-profile" class="action-card" target="_blank">
                <i class="fa-brands fa-linkedin-in action-icon"></i>
                <div class="action-text">
                    <span class="action-label">LinkedIn</span>
                    <span class="action-val">Connect</span>
                </div>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer-note">
            Al-Ahram Group — Industrial Packaging Solutions
        </div>
    </div>

    <!-- VCF Download Script -->
    <script>
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Mina Maged
TITLE:Sales Executive
ORG:Al-Ahram Group
TEL;TYPE=CELL:+201012345678
EMAIL:sales@alahramplastic.com
URL:https://your-company-website.com
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Mina_Maged_Contact.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
