<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }

        .vcard-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Profile Header */
        .profile {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-blue);
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }

        .name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .company {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* Primary Action Button */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Grid Action Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            text-decoration: none;
            transition: background 0.2s;
        }

        .action-card:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .whatsapp .action-icon { color: var(--accent-green); }
        .phone .action-icon { color: var(--accent-blue); }
        .email .action-icon { color: #f59e0b; }
        .location .action-icon { color: #ef4444; }

        .action-text {
            display: flex;
            flex-direction: column;
        }

        .action-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .action-val {
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Section Headings */
        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Social Links & Footer */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="vcard-container">
        <!-- Profile Section -->
        <div class="profile">
            <img src="https://media.licdn.com/dms/image/v2/D4D03AQEBSEqm-eGK-g/profile-displayphoto-scale_200_200/B4DZ33ZXcYGwAY-/0/1777972125386?e=1788998400&v=beta&t=ODZLoSH0t9lU-tdTiUSwUMMCfDJDJW2H-aYr5YrAQwc" alt="Profile Picture" class="avatar">
            <h1 class="name">Eng.Mina Maged</h1>
            <p class="title">Sales & Packaging Specialist</p>
            <p class="company">Al-Ahram plastic group</p>
        </div>

        <!-- Primary CTA: Instant VCF Download -->
        <button class="btn-primary" onclick="downloadVCard()">
            <i class="fa-solid fa-user-plus"></i> Save Contact
        </button>

        <!-- Quick Contact Grid -->
        <div class="action-grid">
            <a href="https://wa.me/+201200379127?text=Hi,%20I'd%20like%20to%20inquire%20about%20your%20products." class="action-card whatsapp" target="_blank">
                <i class="fa-brands fa-whatsapp action-icon"></i>
                <div class="action-text">
                    <span class="action-label">WhatsApp</span>
                    <span class="action-val">Chat Now</span>
                </div>
            </a>

            <a href="tel:+201200379127" class="action-card phone">
                <i class="fa-solid fa-phone action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Call</span>
                    <span class="action-val">Direct Line</span>
                </div>
            </a>

            <a href="mailto:minahalim700@gmail.com" class="action-card email">
                <i class="fa-solid fa-envelope action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Email</span>
                    <span class="action-val">Send Mail</span>
                </div>
            </a>

            <a href="https://ahramplastic.com/" class="action-card location" target="_blank">
                <i class="fa-solid fa-globe action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Website</span>
                    <span class="action-val">Visit Site</span>
                </div>
            </a>
        </div>

        <!-- Social Media -->
        <div class="section-title" style="text-align: center;">Connect Online</div>
        <div class="social-links">
            <a href="https://www.linkedin.com/company/al-ahram-plastic-co-/home/" class="social-icon" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#" class="social-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://web.facebook.com/ahramplasticgroup" class="social-icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        </div>

        <!-- Footer -->
        <div class="footer-note">
            Tap NFC or scan QR to share this card
        </div>
    </div>

    <!-- Dynamic VCF Generation Script -->
    <script>
        function downloadVCard() {
            // Edit your details here
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Eng.Mina Maged
TITLE:Sales & Packaging Specialist
ORG:Al-Ahram plastic group
TEL;TYPE=CELL:+201200379127
EMAIL:minahalim700@gmail.com
URL:https://ahramplastic.com/
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'contact.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
