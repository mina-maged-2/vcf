<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card - Mina Maged | Al-Ahram Group</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8f6f0;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: rgba(194, 146, 53, 0.22);
            --text-primary: #1c1917;
            --text-secondary: #706a60;
            --gold-primary: #c29235;
            --gold-dark: #8a611c;
            --gold-light: #f6efe3;
            --gold-lighter: #fcf9f4;
            --accent-bronze: #a67c52;
            --radius: 16px;
            --shadow-sm: 0 4px 12px rgba(138, 97, 28, 0.06);
            --shadow-md: 0 10px 24px rgba(138, 97, 28, 0.12);
            --shadow-lg: 0 20px 40px rgba(138, 97, 28, 0.16);
            --shadow-glow: 0 0 25px rgba(194, 146, 53, 0.25);
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(194, 146, 53, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(138, 97, 28, 0.06) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            background-attachment: fixed;
        }

        /* ------------------------------------
           PRELOADER SCREEN
        ------------------------------------ */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
        }

        .loader-content {
            text-align: center;
            animation: pulseLogo 1.8s ease-in-out infinite;
        }

        .loader-logo {
            max-width: 190px;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 12px rgba(138, 97, 28, 0.15));
        }

        .loader-bar {
            width: 140px;
            height: 3px;
            background: rgba(194, 146, 53, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
            position: relative;
        }

        .loader-progress {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            border-radius: 10px;
            position: absolute;
            animation: loadingSlide 1.2s ease-in-out infinite alternate;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; }
        }

        @keyframes loadingSlide {
            0% { left: 0%; width: 30%; }
            100% { left: 70%; width: 30%; }
        }

        body.loaded #loader {
            opacity: 0;
            visibility: hidden;
        }

        /* ------------------------------------
           CARD CONTAINER
        ------------------------------------ */
        .vcard-container {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 30px 24px 24px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.loaded .vcard-container {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Animated top accent bar */
        .vcard-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark), var(--gold-primary));
            background-size: 200% 100%;
            animation: shimmerBar 4s linear infinite;
        }

        @keyframes shimmerBar {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* Company Logo Header */
        .company-header {
            text-align: center;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .company-logo {
            max-width: 175px;
            height: auto;
            margin: 0 auto 6px;
            display: block;
            transition: var(--transition-bounce);
            filter: drop-shadow(0 2px 8px rgba(138, 97, 28, 0.1));
        }

        .company-logo:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 4px 12px rgba(138, 97, 28, 0.18));
        }

        .company-tagline {
            font-size: 0.72rem;
            color: var(--gold-dark);
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 14px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold-primary);
            box-shadow: var(--shadow-glow);
            transition: var(--transition-bounce);
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.05);
            box-shadow: 0 0 32px rgba(194, 146, 53, 0.45);
        }

        .name {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.4px;
        }

        .title {
            font-size: 0.82rem;
            color: var(--gold-dark);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Call to Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 11px;
            margin-bottom: 22px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.94rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-bounce);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .btn span {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        /* Light Shimmer Sweep Effect */
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(25deg);
            transition: var(--transition-smooth);
        }

        .btn:hover::after {
            left: 130%;
            transition: all 0.7s ease-in-out;
        }

        .btn:active {
            transform: scale(0.97) !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
            color: #ffffff;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--gold-dark);
            border: 1.5px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--gold-lighter);
            border-color: var(--gold-primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        /* Direct Contact Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px;
            margin-bottom: 22px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--gold-lighter);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            text-decoration: none;
            transition: var(--transition-bounce);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .action-card:hover {
            background: #ffffff;
            border-color: var(--gold-primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }

        .action-icon {
            font-size: 1.15rem;
            color: var(--gold-dark);
            transition: var(--transition-bounce);
            width: 24px;
            text-align: center;
            flex-shrink: 0;
            z-index: 1;
        }

        .action-card:hover .action-icon {
            transform: scale(1.2) rotate(5deg);
            color: var(--gold-primary);
        }

        .action-text {
            display: flex;
            flex-direction: column;
            z-index: 1;
            flex: 1;
        }

        .action-label {
            font-size: 0.68rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
        }

        .action-val {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Footer */
        .footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .vcard-container {
                padding: 24px 18px;
                max-width: 100%;
                border-radius: 18px;
            }

            .name {
                font-size: 1.35rem;
            }

            .avatar-wrapper {
                width: 90px;
                height: 90px;
            }

            .action-grid {
                grid-template-columns: 1fr 1fr;
                gap: 9px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Screen Theme -->
    <div id="loader">
        <div class="loader-content">
            <img src="https://ahramplastic.com/wp-content/uploads/2023/02/logo-7.png" alt="Al-Ahram Group Logo" class="loader-logo">
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>

    <!-- Main Card Container -->
    <div class="vcard-container">
        
        <div class="company-header">
            <img src="https://ahramplastic.com/wp-content/uploads/2023/02/logo-7.png" alt="Al-Ahram Group Logo" class="company-logo">
            <div class="company-tagline">Industrial Packaging Solutions</div>
        </div>

        <div class="profile">
            <div class="avatar-wrapper">
                <img src="https://media.licdn.com/dms/image/v2/D4D03AQEBSEqm-eGK-g/profile-displayphoto-crop_800_800/B4DZ33ZXcYGwAI-/0/1777972125232?e=1789603200&v=beta&t=4aLzRD7m-M34jzpJpRXnYSGHP4-nRhTN6PonRSYMPss" alt="Mina Maged" class="avatar">
            </div>
            <h1 class="name">Mina Maged</h1>
            <p class="title">Sales Executive | Packaging Solutions</p>

                <span>

                    <i class="fa-solid fa-file-pdf"></i> View Product Catalog

                    <i class="fa-solid fa-globe"></i> Visit Official Website

        <div class="action-grid">
            <a href="https://wa.me/201200379127?text=Hi,%20I'd%20like%20to%20inquire%20about%20Al-Ahram%20packaging%20products." class="action-card" target="_blank">
                <i class="fa-brands fa-whatsapp action-icon"></i>
                <div class="action-text">
                    <span class="action-label">WhatsApp</span>
                    <span class="action-val">Chat Now</span>

            </a>

            <a href="tel:+201200379127" class="action-card">
                <i class="fa-solid fa-phone action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Call</span>
                    <span class="action-val">Direct Line</span>
                </div>
            </a>

            <a href="mailto:mina.maged@ahramplastic.com" class="action-card">
                <i class="fa-solid fa-envelope action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Email</span>
                    <span class="action-val">Send Mail</span>
                </div>
            </a>

            <a href="https://www.linkedin.com/in/mina-maged-1451b7407/" class="action-card" target="_blank">
                <i class="fa-brands fa-linkedin-in action-icon"></i>
                <div class="action-text">
                    <span class="action-label">LinkedIn</span>
                    <span class="action-val">Connect</span>
                </div>
            </a>

            <a href="https://www.facebook.com/ahramplasticgroup" class="action-card" target="_blank">
                <i class="fa-brands fa-facebook-f action-icon"></i>

                    <span class="action-label">Facebook</span>

                </div>
            </a>

            <a href="https://maps.app.goo.gl/pbsaNYLEP9VZ75um6?g_st=aw" class="action-card" target="_blank">
                <i class="fa-solid fa-map-location-dot action-icon"></i>
                <div class="action-text">
                    <span class="action-label">Location</span>
                    <span class="action-val">Factory Map</span>
                </div>
            </a>
        </div>

        <div class="footer-note">
            Al-Ahram Group — Industrial Packaging Solutions
        </div>
    </div>

    <script>
        // Smooth Loader Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 600);
        });

        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:Maged;Mina;;;
FN:Mina Maged
TITLE:Sales Executive
ORG:Al-Ahram Group
TEL;TYPE=CELL:+201200379127
EMAIL:mina.maged@ahramplastic.com
URL:https://ahramplastic.com/
URL;TYPE=LinkedIn:https://www.linkedin.com/in/mina-maged-1451b7407/
URL;TYPE=Location:https://maps.app.goo.gl/pbsaNYLEP9VZ75um6?g_st=aw
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Mina_Maged_Contact.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
